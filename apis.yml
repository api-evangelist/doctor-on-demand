name: Doctor on Demand
description: Doctor on Demand is a telehealth platform offering 24/7 virtual medical care through video
  visits with board-certified clinicians. Services span urgent care, mental health therapy, psychiatry,
  primary care, and preventive health, with prescriptions routed to local pharmacies. Now part of Included
  Health, it serves consumers directly and through employer and health-plan benefit programs. It was
  surfaced as a portfolio company of a16z, GV, and Shasta Ventures. As of this enrichment pass Doctor on
  Demand publishes no public developer or partner API program; this profile carries the company identity
  and probed domain-security posture only.
